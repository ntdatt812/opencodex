name: Log Guard Inspect CodeRabbit TDD

on:
  pull_request: {}

concurrency:
  group: log-guard-inspect-coderabbit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: API and doctor regressions
        run: bun test --isolate tests/api-codex-log-guard.test.ts tests/codex-log-guard-doctor.test.ts
      - name: GUI regressions
        run: cd gui && bun test --isolate tests/storage-log-guard.test.tsx
